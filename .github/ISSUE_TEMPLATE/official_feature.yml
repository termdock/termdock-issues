name: Planned Feature
description: Official feature announcement and tracking
title: "[Feature] "
labels: ["official", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **✨ Planned Feature**

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is this feature?
    validations:
      required: true

  - type: textarea
    id: features
    attributes:
      label: Features List
      description: List of features/capabilities
      placeholder: |
        - Feature 1
        - Feature 2
        - Feature 3

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 - Critical
        - P1 - High
        - P2 - Medium
        - P3 - Low
    validations:
      required: true
